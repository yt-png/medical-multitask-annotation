[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mma"
version = "0.1.0"
description = "医学图像多任务标注数据流（本地可脚本化）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.8.0",
]

[project.scripts]
mma = "mma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mma.formats" = ["*.json"]
"mma.labelstudio.configs" = ["*.xml"]
